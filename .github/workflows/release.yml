name: Release

# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# Assets:
#   openg2p-pack-<CODE>-<tag>.tar.gz   one per country pack, with packs/roles.json
#   openg2p-data-<tag>.tar.gz          the whole repo at that tag (git archive)
#   SHA256SUMS
#
# A release is only cut from a tree that passes the same gates as CI, so a
# db-seed image pinned to a release tag never seeds a pack that fails validation.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v2.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install jsonschema

      - name: JSON, GeoJSON and CSV are well-formed
        run: python scripts/ci/check_data_files.py

      - name: validate_pack.py
        working-directory: scripts/packs
        run: |
          packs=$(ls -d ../../packs/*/ | while read d; do [ -f "$d/manifest.json" ] && echo "${d%/}"; done)
          python validate_pack.py $packs

  publish:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Build assets
        run: |
          mkdir -p dist
          for d in packs/*/; do
            code=$(basename "$d")
            [ -f "$d/manifest.json" ] || continue
            tar -czf "dist/openg2p-pack-${code}-${TAG}.tar.gz" -C packs "$code" roles.json
          done
          git archive --format=tar.gz --prefix="openg2p-data-${TAG}/" \
            -o "dist/openg2p-data-${TAG}.tar.gz" HEAD
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist && cat dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
